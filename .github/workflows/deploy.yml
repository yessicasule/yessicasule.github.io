name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Re-running an old run replays that old commit and publishes it over
      # whatever is live. That happened on 2026-10-02: a re-run of the very
      # first run put the 28 Sep build back on the site. Fail instead.
      - name: Refuse to publish a commit that is no longer the tip of main
        run: |
          git fetch --depth=1 origin main
          latest=$(git rev-parse FETCH_HEAD)
          if [ "$GITHUB_SHA" != "$latest" ]; then
            echo "::error::This run builds $GITHUB_SHA but main is now $latest."
            echo "Publishing it would roll the live site back. Re-run the newest run, or use Run workflow on main."
            exit 1
          fi
          echo "$GITHUB_SHA is the tip of main - continuing."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      # Runs tsc -b before vite build, so a type error fails the deploy.
      - name: Build
        run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
